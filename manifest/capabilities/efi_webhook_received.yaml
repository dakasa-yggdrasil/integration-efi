name: efi_webhook_received
description: Reactor kept for contract compatibility. Normalizes an EFI Pix callback body; the adapter wires no event sink, so a non-empty pix array fails and an empty one returns emitted=false.
category: reactor
resource_types: [webhook]
idempotent: true
input_schema:
  required: [pix]
  properties:
    pix:
      type: array
      items:
        type: object
        properties:
          endToEndId: {type: string}
          txid: {type: string}
          valor: {type: string}
          status: {type: string}
          chave: {type: string}
          horario: {type: string}
          devolucoes:
            type: array
output_schema:
  properties:
    emitted: {type: boolean}
    e2eId: {type: string}
