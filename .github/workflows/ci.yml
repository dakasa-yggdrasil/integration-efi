name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify vendored common SDK matches canonical module generation
        run: |
          vendor_output="$RUNNER_TEMP/vendor-sdk010"
          go mod vendor -o "$vendor_output"
          diff -ru vendor/github.com/dakasa-yggdrasil/yggdrasil-sdk-go "$vendor_output/github.com/dakasa-yggdrasil/yggdrasil-sdk-go"

      - name: Test
        run: go test -race -v ./...

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (smoke)
        run: docker build -f Dockerfile -t integration-efi:ci .
